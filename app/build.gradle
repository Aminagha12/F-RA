plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hamidi.forexrobot'
    compileSdk 34

    defaultConfig {
        applicationId "com.hamidi.forexrobot"
        minSdk 19
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
    }
}

dependencies {
    // No extra dependencies needed - using built-in WebView
}
